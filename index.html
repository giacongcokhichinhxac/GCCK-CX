<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Control - ERP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Thư viện quét mã QR -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { navy: '#0f172a', primary: '#2563eb', accent: '#f97316' }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;

        // ==========================================
        // 1. CẤU HÌNH SUPABASE (ĐÃ ĐIỀN ĐÚNG THÔNG TIN CỦA BẠN)
        // ==========================================
        const SUPABASE_URL = "https://dwrwvxtjraerrkzhzaqs.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_oZrP8Gf_ASPRMkQEQ6BBCw_s6vd1gGT"; 
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // 2. QUẢN LÝ ĐĂNG NHẬP
        // ==========================================
        const AuthContext = createContext(null);

        function AuthProvider({ children }) {
            const [session, setSession] = useState(null);
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchProfile(session.user.id);
                    else setLoading(false);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) fetchProfile(session.user.id);
                    else { setProfile(null); setLoading(false); }
                });

                return () => subscription.unsubscribe();
            }, []);

            const fetchProfile = async (userId) => {
                const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
                setProfile(data);
                setLoading(false);
            };

            const signIn = async (email, password) => await supabase.auth.signInWithPassword({ email, password });
            const signOut = async () => await supabase.auth.signOut();

            return (
                <AuthContext.Provider value={{ session, profile, loading, signIn, signOut }}>
                    {children}
                </AuthContext.Provider>
            );
        }
        const useAuth = () => useContext(AuthContext);

        // ==========================================
        // 3. GIAO DIỆN ĐĂNG NHẬP
        // ==========================================
        function Login() {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const { signIn } = useAuth();

            const handleLogin = async (e) => {
                e.preventDefault();
                const { error } = await signIn(email, password);
                if (error) setErrorMsg(error.message);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-navy">
                    <div className="bg-white p-8 rounded-lg shadow-xl w-full max-w-md">
                        <h1 className="text-2xl font-bold text-center text-navy mb-6">PRODUCTION CONTROL</h1>
                        {errorMsg && <div className="bg-red-100 text-red-600 p-3 rounded mb-4 text-sm">{errorMsg}</div>}
                        <form onSubmit={handleLogin} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Email</label>
                                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required className="mt-1 block w-full border border-gray-300 rounded-md p-2" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700">Mật khẩu</label>
                                <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required className="mt-1 block w-full border border-gray-300 rounded-md p-2" />
                            </div>
                            <button type="submit" className="w-full bg-primary text-white p-2 rounded-md hover:bg-blue-700 transition">Đăng nhập</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. DASHBOARD
        // ==========================================
        function Dashboard() {
            return (
                <div>
                    <h1 className="text-2xl font-bold text-gray-800 mb-6">Dashboard Tổng Quan</h1>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                        {[
                            { title: 'Tổng đơn hàng', value: '1', color: 'bg-blue-500' },
                            { title: 'Đang sản xuất', value: '0', color: 'bg-orange-500' },
                            { title: 'Đã hoàn thành', value: '0', color: 'bg-green-500' },
                            { title: 'Đơn trễ tiến độ', value: '0', color: 'bg-red-500' },
                        ].map((item, idx) => (
                            <div key={idx} className="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
                                <h3 className="text-gray-500 text-sm font-medium">{item.title}</h3>
                                <p className="text-3xl font-bold mt-2">{item.value}</p>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 5. QUẢN LÝ ĐƠN HÀNG & CHI TIẾT BOM
        // ==========================================
        function Orders() {
            const [orders, setOrders] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isImportModalOpen, setIsImportModalOpen] = useState(false);
            
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [details, setDetails] = useState([]);

            const [importLsx, setImportLsx] = useState('');
            const [file, setFile] = useState(null);
            const [formData, setFormData] = useState({ lsx: '', customer: '', name: '', due_date: '' });
            const [loading, setLoading] = useState(true);

            useEffect(() => { fetchOrders(); }, []);

            const fetchOrders = async () => {
                setLoading(true);
                const { data, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
                if (!error) setOrders(data);
                setLoading(false);
            };

            const viewDetails = async (order) => {
                setSelectedOrder(order);
                const { data, error } = await supabase.from('order_details').select('*').eq('order_id', order.id).order('stt');
                if (!error) setDetails(data);
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                const { error } = await supabase.from('orders').insert([formData]);
                if (error) alert("Lỗi: " + error.message);
                else { setIsModalOpen(false); setFormData({ lsx: '', customer: '', name: '', due_date: '' }); fetchOrders(); }
            };

            const handleImportBOM = async () => {
                if (!file || !importLsx) return alert("Vui lòng nhập mã LSX và chọn file CSV!");
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    const rows = [];
                    for (let i = 1; i < lines.length; i++) {
                        const currentline = lines[i].split(',');
                        if(currentline.length < 9) continue;
                        rows.push({
                            stt: currentline[0], msct: currentline[1], part_name: currentline[2], material: currentline[3],
                            spec_length: currentline[4] || null, spec_width: currentline[5] || null, spec_thickness: currentline[6] || null, spec_shape: currentline[7] || null,
                            quantity_required: currentline[8] || 1, production_line: currentline[9] || 'Chưa xếp', note: currentline[10] || ''
                        });
                    }
                    const { data, error } = await supabase.rpc('import_bom_rows', { p_order_lsx: importLsx, p_rows: rows });
                    if (error) alert("Lỗi khi Import: " + error.message);
                    else { alert(`Import thành công ${data.inserted} dòng. Thất bại: ${data.failed}`); setIsImportModalOpen(false); fetchOrders(); }
                };
                reader.readAsText(file);
            };

            if (selectedOrder) {
                return (
                    <div>
                        <button onClick={() => setSelectedOrder(null)} className="mb-4 text-primary hover:underline">&larr; Quay lại danh sách</button>
                        <div className="bg-white p-6 rounded shadow mb-6">
                            <h2 className="text-xl font-bold text-navy">Chi tiết LSX: {selectedOrder.lsx}</h2>
                            <p className="text-gray-600">Khách hàng: {selectedOrder.customer}</p>
                        </div>
                        <div className="bg-white rounded-lg shadow overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">STT</th>
                                        <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">MSCT</th>
                                        <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tên chi tiết</th>
                                        <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">SL/ĐH</th>
                                        <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Chuyền</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {details.length === 0 ? <tr><td colSpan="5" className="text-center py-4">Chưa có dữ liệu BOM</td></tr> : 
                                     details.map(d => (
                                        <tr key={d.id}>
                                            <td className="px-4 py-3">{d.stt}</td>
                                            <td className="px-4 py-3 font-medium">{d.msct}</td>
                                            <td className="px-4 py-3">{d.part_name}</td>
                                            <td className="px-4 py-3">{d.quantity_required}</td>
                                            <td className="px-4 py-3">{d.production_line}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl font-bold text-gray-800">Quản lý Đơn hàng</h1>
                        <div className="space-x-3">
                            <button onClick={() => setIsImportModalOpen(true)} className="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700">Nhập BOM (CSV)</button>
                            <button onClick={() => setIsModalOpen(true)} className="bg-primary text-white px-4 py-2 rounded shadow hover:bg-blue-700">+ Tạo Đơn Hàng</button>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">LSX</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Khách hàng</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Tên đơn hàng</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Hành động</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {loading ? <tr><td colSpan="4" className="text-center py-4">Đang tải...</td></tr> : 
                                 orders.map((order) => (
                                    <tr key={order.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4 whitespace-nowrap font-medium text-primary cursor-pointer hover:underline" onClick={() => viewDetails(order)}>{order.lsx}</td>
                                        <td className="px-6 py-4 whitespace-nowrap">{order.customer}</td>
                                        <td className="px-6 py-4">{order.name}</td>
                                        <td className="px-6 py-4">
                                            <button onClick={() => viewDetails(order)} className="text-primary hover:text-blue-800 text-sm font-medium">Xem BOM</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md shadow-2xl">
                                <h2 className="text-xl font-bold mb-4">Tạo Đơn Hàng Mới</h2>
                                <form onSubmit={handleCreate} className="space-y-4">
                                    <input type="text" placeholder="Mã LSX" value={formData.lsx} onChange={(e) => setFormData({...formData, lsx: e.target.value})} required className="w-full border p-2 rounded" />
                                    <input type="text" placeholder="Khách hàng" value={formData.customer} onChange={(e) => setFormData({...formData, customer: e.target.value})} className="w-full border p-2 rounded" />
                                    <input type="text" placeholder="Tên đơn hàng" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} required className="w-full border p-2 rounded" />
                                    <div className="flex justify-end space-x-3 mt-6">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 border rounded">Hủy</button>
                                        <button type="submit" className="px-4 py-2 bg-primary text-white rounded">Lưu</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    {isImportModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white p-6 rounded-lg w-full max-w-md shadow-2xl">
                                <h2 className="text-xl font-bold mb-4">Nhập BOM từ CSV</h2>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Mã LSX" value={importLsx} onChange={(e) => setImportLsx(e.target.value)} className="w-full border p-2 rounded" />
                                    <input type="file" accept=".csv" onChange={(e) => setFile(e.target.files[0])} className="w-full border p-2 rounded" />
                                    <div className="flex justify-end space-x-3 mt-6">
                                        <button type="button" onClick={() => setIsImportModalOpen(false)} className="px-4 py-2 border rounded">Hủy</button>
                                        <button type="button" onClick={handleImportBOM} className="px-4 py-2 bg-green-600 text-white rounded">Import</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 6. QUÉT MÃ QR (CAMERA)
        // ==========================================
        function QRScanner({ type }) {
            const [scannedData, setScannedData] = useState(null);
            const [error, setError] = useState('');
            const [quantity, setQuantity] = useState(1);
            const scannerRef = useRef(null);

            useEffect(() => {
                const html5QrCode = new Html5Qrcode("reader");
                scannerRef.current = html5QrCode;

                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 250 } },
                    (decodedText) => {
                        html5QrCode.stop().then(() => { handleScanSuccess(decodedText); }).catch(err => console.error(err));
                    },
                    (errorMessage) => { /* Bỏ qua lỗi quét */ }
                ).catch(err => setError("Không thể mở camera: " + err));

                return () => {
                    if (scannerRef.current) { scannerRef.current.stop().catch(e => console.log(e)); }
                };
            }, []);

            const handleScanSuccess = async (text) => {
                try {
                    const parts = text.split('|');
                    if (parts.length < 2) throw new Error("Mã QR không đúng định dạng (Cần có dấu |)");
                    
                    const lsx = parts[0].trim();
                    const stt = parts[1].trim();
                    const lsx_stt = `${lsx}-${stt}`;

                    const { data, error } = await supabase.from('order_details').select('*').eq('lsx_stt', lsx_stt).single();
                    
                    if (error || !data) throw new Error("Không tìm thấy dữ liệu cho mã: " + lsx_stt);
                    
                    setScannedData(data);
                    setQuantity(data.quantity_required); // Mặc định lấy SL yêu cầu
                } catch (err) {
                    setError(err.message);
                }
            };

            const handleSubmit = async () => {
                alert(`Đã quét: ${scannedData.lsx_stt}. Số lượng: ${quantity}. (Chức năng lưu đang được hoàn thiện)`);
                window.location.reload();
            };

            return (
                <div className="max-w-2xl mx-auto">
                    <h1 className="text-2xl font-bold mb-6 text-center">{type === 'receipt' ? 'NHẬN VẬT TƯ' : 'GIAO HÀNG'}</h1>
                    
                    {error && <div className="bg-red-100 text-red-700 p-4 rounded mb-4 text-center">{error} <button onClick={() => window.location.reload()} className="underline font-bold">Thử lại</button></div>}

                    {!scannedData ? (
                        <div className="bg-white p-4 rounded shadow">
                            <div id="reader" className="w-full"></div>
                            <p className="text-center text-gray-500 mt-4">Đưa mã QR vào khung hình để quét</p>
                        </div>
                    ) : (
                        <div className="bg-white p-6 rounded shadow border-t-4 border-primary">
                            <h2 className="text-xl font-bold text-green-600 mb-4 text-center">Quét Thành Công!</h2>
                            <div className="space-y-2 mb-6">
                                <p><strong>Mã LSX-STT:</strong> {scannedData.lsx_stt}</p>
                                <p><strong>Tên chi tiết:</strong> {scannedData.part_name}</p>
                                <p><strong>Mã chi tiết:</strong> {scannedData.msct}</p>
                                <p><strong>Số lượng yêu cầu:</strong> {scannedData.quantity_required}</p>
                            </div>
                            
                            <div className="mb-6">
                                <label className="block text-sm font-medium mb-2">Số lượng {type === 'receipt' ? 'nhận' : 'giao'} thực tế:</label>
                                <input type="number" value={quantity} onChange={(e) => setQuantity(e.target.value)} className="w-full text-2xl p-3 border-2 border-primary rounded text-center font-bold" />
                            </div>

                            <button onClick={handleSubmit} className="w-full bg-primary text-white text-lg py-3 rounded shadow hover:bg-blue-700">
                                XÁC NHẬN {type === 'receipt' ? 'NHẬN' : 'GIAO'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }


        // ==========================================
        // 7. LAYOUT & ĐIỀU HƯỚNG
        // ==========================================
        function DesktopLayout({ children, currentPage, setCurrentPage }) {
            const { profile, signOut } = useAuth();
            const menuItems = [
                { id: 'dashboard', name: 'Dashboard' },
                { id: 'orders', name: 'Quản lý đơn hàng' },
                { id: 'receipt', name: 'Nhận vật tư QR' },
                { id: 'delivery', name: 'Giao hàng QR' },
            ];

            return (
                <div className="flex h-screen overflow-hidden">
                    <aside className="w-64 bg-navy text-white flex flex-col">
                        <div className="h-16 flex items-center justify-center border-b border-gray-700">
                            <h2 className="text-xl font-bold tracking-wider">PRODUCTION</h2>
                        </div>
                        <nav className="flex-1 overflow-y-auto py-4">
                            {menuItems.map((item) => (
                                <div key={item.id} onClick={() => setCurrentPage(item.id)}
                                     className={`flex items-center px-6 py-3 cursor-pointer transition ${currentPage === item.id ? 'bg-primary border-r-4 border-accent' : 'hover:bg-gray-800'}`}>
                                    <span className="text-sm font-medium">{item.name}</span>
                                </div>
                            ))}
                        </nav>
                    </aside>

                    <div className="flex-1 flex flex-col overflow-hidden">
                        <header className="h-16 bg-white shadow-sm flex items-center justify-between px-6">
                            <div className="text-lg font-semibold text-gray-700">Hệ thống Quản lý Sản xuất</div>
                            <div className="flex items-center space-x-4">
                                <span className="text-sm text-gray-600">Xin chào, <strong>{profile?.full_name || 'User'}</strong></span>
                                <button onClick={signOut} className="text-red-500 hover:text-red-700 text-sm font-medium">Đăng xuất</button>
                            </div>
                        </header>
                        <main className="flex-1 overflow-y-auto p-6">{children}</main>
                    </div>
                </div>
            );
        }

        function MainApp() {
            const { session, loading } = useAuth();
            const [currentPage, setCurrentPage] = useState('dashboard');

            if (loading) return <div className="h-screen flex items-center justify-center text-xl">Đang tải...</div>;
            if (!session) return <Login />;

            return (
                <DesktopLayout currentPage={currentPage} setCurrentPage={setCurrentPage}>
                    {currentPage === 'dashboard' && <Dashboard />}
                    {currentPage === 'orders' && <Orders />}
                    {currentPage === 'receipt' && <QRScanner type="receipt" />}
                    {currentPage === 'delivery' && <QRScanner type="delivery" />}
                </DesktopLayout>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthProvider><MainApp /></AuthProvider>);
    </script>
</body>
</html>
